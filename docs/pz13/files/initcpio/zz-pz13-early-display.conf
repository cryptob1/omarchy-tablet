# ASUS ProArt PZ13: keep the display driver out of the boot image.
#
# The `kms` hook puts msm (the Snapdragon display driver) in the initramfs, but
# it cannot finish starting there: its two USB-C DisplayPort outputs wait on
# parts that only exist once the disk is open. Half-started, it resets the
# display and powers the panel down, so the disk-password prompt (unl0kr, see
# zz-touch-unlock.conf) is drawn on a black screen. Without it the firmware
# framebuffer stays lit and the prompt is visible; msm loads from the disk a
# second after unlock, as it effectively did before.
#
# To undo: delete this file and run `sudo limine-mkinitcpio`.
_pz13_hooks=()
for _pz13_hook in "${HOOKS[@]}"; do
  [[ $_pz13_hook == kms ]] || _pz13_hooks+=("$_pz13_hook")
done
HOOKS=("${_pz13_hooks[@]}")
unset _pz13_hooks _pz13_hook

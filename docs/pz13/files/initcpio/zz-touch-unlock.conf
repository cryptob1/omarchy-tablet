# Installed to /etc/mkinitcpio.conf.d/ by the touch-unlock item.
# Put touch-unlock immediately before encrypt. Sorts last so it sees the final
# HOOKS; mkinitcpio sources drop-ins more than once, so insert only once. With
# no encrypt hook (an unencrypted or systemd-initramfs machine) it does nothing.
if [[ " ${HOOKS[*]:-} " == *" encrypt "* && " ${HOOKS[*]:-} " != *" touch-unlock "* ]]; then
  _touch_unlock_hooks=()
  for _touch_unlock_hook in "${HOOKS[@]}"; do
    [[ $_touch_unlock_hook == encrypt ]] && _touch_unlock_hooks+=(touch-unlock)
    _touch_unlock_hooks+=("$_touch_unlock_hook")
  done
  HOOKS=("${_touch_unlock_hooks[@]}")
  unset _touch_unlock_hooks _touch_unlock_hook
fi

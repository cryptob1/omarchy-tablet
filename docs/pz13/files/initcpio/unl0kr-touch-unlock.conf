# Installed to /etc/unl0kr.conf.d/ by the touch-unlock item.
[general]
# The firmware framebuffer is all there is this early (the real display driver
# only loads after the disk is open).
backend=fbdev
animations=false

[keyboard]
# Always show the keyboard: the power and volume buttons count as a "hardware
# keyboard", which would otherwise hide it on a tablet.
autohide=false

[theme]
default=breezy-dark

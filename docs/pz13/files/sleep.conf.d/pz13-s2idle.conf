# ASUS ProArt PZ13 (Snapdragon X): the kernel defaults to deep sleep (PSCI
# system suspend). On 2026-11-09 one deep suspend resumed fine and the next
# reset the machine on wake. Suspend to idle is the mode Omarchy uses on its
# other Snapdragon X laptops, so sleep that way.
[Sleep]
MemorySleepMode=s2idle
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
